[package]
name = "kit-demo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The smallest kit program: one switch, one slider, one live status line. The kit's tests talk to it."

# What the Toolbox needs to know (DESIGN.md 15.4); program.json is generated from this by build.rs.
[package.metadata.toolbox]
id = "kit_demo"
exe = "KitDemo.exe"
category = { de = "Allgemein", en = "General" }
background = true
name = { de = "Kit-Demo", en = "Kit Demo" }
description = { de = "Das kleinste Kit-Programm: ein Schalter, ein Regler, eine Statuszeile. Zum Ausprobieren und für die Tests des Kits.", en = "The smallest kit program: one switch, one slider, one live status line. For trying things out and for the kit's tests." }

[dependencies]
kit.workspace = true
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true

[build-dependencies]
kit = { package = "toolbox-kit", path = "../kit", default-features = false, features = ["build"] }
