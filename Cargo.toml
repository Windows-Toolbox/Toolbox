# One command builds everything in this repo: the shared library, the Toolbox and the kit's demo program.
[workspace]
resolver = "3"
members = ["kit", "toolbox", "demo"]

[workspace.package]
edition = "2024"
repository = "https://github.com/Windows-Toolbox/Toolbox"

# Versions looked up 2026-11-16 (DESIGN.md 15.7).
[workspace.dependencies]
# Written `kit::…` in the code.
kit = { package = "toolbox-kit", path = "kit" }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "system_fonts", "clipboard", "links", "accesskit"] }
egui = { version = "0.37.0", default-features = false }
rfd = { version = "0.18.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows-sys = "0.61.2"

[profile.release]
lto = true
strip = true
codegen-units = 1
