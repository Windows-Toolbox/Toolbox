[package]
name = "toolbox"
version = "2.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "One window and one tray icon for all your programs: start, stop, settings."

# What the build writes into program.json and into the exe (DESIGN.md 15.4).
[package.metadata.toolbox]
id = "toolbox"
exe = "Toolbox.exe"
# The Toolbox is installed into dist\ of the repo, not of this crate's folder.
dist = "../dist"
icon = "assets/toolbox.ico"
category = { de = "Allgemein", en = "General" }
background = true
name = "Windows Toolbox"

[dependencies]
kit.workspace = true
eframe.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
# COM, for the Start menu shortcut only (system.rs) – eframe already brings this crate along.
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_System_Variant"] }

[dev-dependencies]
ed25519-dalek.workspace = true

[build-dependencies]
kit = { package = "toolbox-kit", path = "../kit", default-features = false, features = ["build"] }
