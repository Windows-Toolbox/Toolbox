[package]
name = "toolbox"
version = "2.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "One window and one tray icon for all your programs: start, stop, settings."

# What the build writes into program.json and into the exe (DESIGN.md 15.4).
[package.metadata.toolbox]
id = "toolbox"
exe = "Toolbox.exe"
# The Toolbox is installed into dist\ of the repo, not of this crate's folder.
dist = "../dist"
icon = "assets/toolbox.ico"
category = { de = "Allgemein", en = "General" }
background = true
name = "Windows Toolbox"

[dependencies]
kit.workspace = true
eframe.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
kit = { package = "toolbox-kit", path = "../kit", default-features = false, features = ["build"] }
